  <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GuiaCidadão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/screens.css">
</head>

<div id="app">
<body>
<!-- ===== TELA: MEUS AGENDAMENTOS ===== -->
<div id="meus-agendamentos" class="screen">

  <!-- CABEÇALHO -->
  <div class="app-header">
    <button class="back-btn" id="btnBackAgendamentos" aria-label="Voltar">
        <a href="../home/home.html">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
        </a>
    </button>
    <a class="header-logo" href="../home/home.html">
      <img src="/src/assets/icons/Logo.png" alt="Logo" width="24" height="24">
      GuiaCidadão
    </a>
    <div style="width:36px"></div>
  </div>

  <!-- CONTEÚDO ROLÁVEL -->
  <div class="scroll-content">

    <!-- BLOCO DE TÍTULOS -->
    <div class="auth-title-block" style="padding: 24px 18px 16px;">
      <h1 class="page-title">Meus Agendamentos</h1>
      <p class="page-subtitle" style="color: var(--primary);">
        Gerencie e acompanhe a situação dos seus atendimentos marcados
      </p>
    </div>

    <div style="padding: 0 18px;">

      <p class="agend-section-label">Agendamentos</p>
      <div id="meus-agendamentos-cards"></div>

      <!-- ── ESTADO VAZIO (oculto por padrão) ── -->
      <div class="empty-state" id="emptyStateAgendamentos">
        <div style="font-size:52px; margin-bottom:18px; line-height:1;">🗓️</div>
        <p class="page-title" style="font-size:17px; margin-bottom:8px;">Nenhum agendamento</p>
        <p class="page-subtitle">
          Você não possui nenhum agendamento marcado no momento.
        </p>
      </div>

    </div><!-- /padding wrapper -->
  </div><!-- /scroll-content -->

  <!-- BOTÃO FIXO INFERIOR -->
  <div class="agend-bottom-bar">
    <a href="./agendamento.html" class="btn btn-primary" id="btnNovoAgendamento">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Novo Agendamento
    </a>
</div>

</div><!-- /#meus-agendamentos -->
<script src="/src/js/agendamento-service.js"></script>
<script src="/src/js/main.js"></script>
</html>
