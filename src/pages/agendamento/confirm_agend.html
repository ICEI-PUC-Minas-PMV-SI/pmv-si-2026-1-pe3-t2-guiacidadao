<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GuiaCidadão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/screens.css">
</head>
<div id="app">
<body>
  <div id="confirmar-agendamento" class="screen">
    <div class="app-header">
      <button class="back-btn" data-back="agendamento">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      </button>
      <a class="header-logo">
        <img src="/src/assets/icons/Logo.png" alt="Logo">
        GuiaCidadão
      </a>
      <div style="width:36px"></div>
    </div>

    <div class="scroll-content">
      <div style="padding:24px 20px 32px;">
        <div class="auth-title-block" style="margin-bottom:8px;">
          <h1 class="page-title">Confirmar Agendamento</h1>
          <p class="page-subtitle" style="color:var(--primary);">Revise os dados do seu atendimento antes de concluir</p>
        </div>

        <div class="card" style="margin-top:20px;padding:0 16px;">
          <div class="confirm-row">
            <div class="confirm-row-left">
              <div class="confirm-row-icon">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
              </div>
              <span class="confirm-label">Nome do usuário</span>
            </div>
            <span class="confirm-value" id="conf-nome">João Silva</span>
          </div>

          <div class="confirm-row">
            <div class="confirm-row-left">
              <div class="confirm-row-icon">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
              </div>
              <span class="confirm-label">CPF</span>
            </div>
            <span class="confirm-value" id="conf-cpf">123.456.789-00</span>
          </div>

          <div class="confirm-row">
            <div class="confirm-row-left">
              <div class="confirm-row-icon">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              </div>
              <span class="confirm-label">Benefício/Serviço</span>
            </div>
            <span class="confirm-value" id="conf-servico">Auxílio Gás</span>
          </div>

          <div class="confirm-row">
            <div class="confirm-row-left">
              <div class="confirm-row-icon">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
              </div>
              <span class="confirm-label">Unidade</span>
            </div>
            <span class="confirm-value" id="conf-unidade">Rio de Janeiro - Centro</span>
          </div>

          <div class="confirm-row">
            <div class="confirm-row-left">
              <div class="confirm-row-icon">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              </div>
              <span class="confirm-label">Data</span>
            </div>
            <span class="confirm-value" id="conf-data" style="font-size:12px;">Terça-feira, 16 de maio de 2026</span>
          </div>

          <div class="confirm-row">
            <div class="confirm-row-left">
              <div class="confirm-row-icon">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              </div>
              <span class="confirm-label">Horário</span>
            </div>
            <span class="confirm-value" id="conf-horario">10:00</span>
          </div>
        </div>

        <div style="margin-top:24px;display:flex;flex-direction:column;gap:12px;">

            <a href="/src/pages/agendamento/sucess_agend.html">
          <button class="btn btn-primary" id="btn-confirmar-ag">Confirmar Agendamento</button>
          </a>

          <a href="/src/pages/home/home.html">
          <button class="btn btn-outline" id="btn-cancelar-ag">Cancelar Agendamento</button>
          </a>
          
          <div style="text-align:center;">            
            <a href="/src/pages/agendamento/agendamento.html">
            <button class="btn-link" id="btn-editar-ag">Editar Agendamento</button>
            </a>

          </div>
        </div>
      </div>
    </div>
  </div>
</body>

<!-- ===== TOAST ===== -->
  <div id="toast"></div>
</div>

<script src="/src/js/main.js"></script>
<script>
  // Setup protocol number on success
  document.addEventListener('DOMContentLoaded', () => {
    // Override confirm to also set protocol
    const origConfirm = window.handleConfirmarAgendamento;
    const btnConf = document.getElementById('btn-confirmar-ag');
    if (btnConf) {
      btnConf.addEventListener('click', () => {
        const proto = 'GC-' + Math.floor(Math.random() * 900000 + 100000);
        const el = document.getElementById('protocolo-num');
        if (el) el.textContent = proto;
      }, true);
    }

    // CRAS Mais próximo navigation from sidebar
    document.querySelectorAll('[data-nav="unidades"]').forEach(el => {
      el.addEventListener('click', () => {
        renderUnidades();
        navigate('unidades');
      });
    });
  });
</script>
</html>
