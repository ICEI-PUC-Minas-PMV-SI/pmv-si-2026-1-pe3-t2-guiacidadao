<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GuiaCidadão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/screens.css">
</head>
<div id="app">
<body>

  <div id="login" class="screen active auth-screen">
    <div class="app-header">
<a href="/src/pages/login/login.html">
      <button class="back-btn" aria-label="Voltar" type="button">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      </button>
        <div style="width:36px"></div>
      <a class="header-logo">
        <img src="/src/assets/icons/Logo.png" alt="GuiaCidadão">
        GuiaCidadão
      </a>
      <div style="width:36px"></div>
    </div>
    <div class="scroll-content">
      <div class="auth-body">
        <div class="auth-title-block">
          <h1 class="page-title">Registrar conta</h1>
          <p class="page-subtitle">Crie sua conta para acessar os serviços</p>
        </div>

        <div class="form-group">
          <label class="form-label">Nome completo</label>
          <input class="form-input" type="text" id="cad-nome" placeholder="Jorge Silva" autocomplete="name">
        </div>
        <div class="form-group">
          <label class="form-label">CPF</label>
          <input class="form-input" type="text" id="cad-cpf" placeholder="000.000.000-00" autocomplete="off" maxlength="14" inputmode="numeric">
        </div>
        <div class="form-group">
          <label class="form-label">Data de nascimento</label>
          <input class="form-input" type="date" id="cad-dob" placeholder="DD/MM/AAAA" autocomplete="bday">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" type="email" id="cad-email" placeholder="exemplo@gmail.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input class="form-input" type="password" id="cad-pw" placeholder="Crie sua senha" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label">Confirmar senha</label>
          <input class="form-input" type="password" id="cad-pw2" placeholder="Repita a senha" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="checkbox-wrapper">
            <input type="checkbox" id="cad-terms">
            <span>Aceito os <a href="/src/pages/lgpd/termos.html" target="_blank">termos de uso</a> e <a href="/src/pages/lgpd/privacidade.html" target="_blank">política de privacidade</a></span>
          </label>
        </div>

        <button class="btn btn-primary" id="btn-cadastrar" onclick="registrar()">Criar conta</button>

        <div class="auth-links">
          <a href="/src/pages/login/login.html">
          <button class="btn-link" data-back="login">Já tem uma conta? Entrar</button>
          </a>
        </div>
      </div>
    </div>
  </div>
  </div>
 </body>
<script src="/src/js/shared/cpf.js"></script>
<script src="/src/js/shared/hash.js"></script>
<script src="/src/pages/register/register.js"></script>
 </html>
