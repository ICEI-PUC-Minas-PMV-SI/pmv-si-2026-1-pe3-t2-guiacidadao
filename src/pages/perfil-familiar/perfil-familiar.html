<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil Familiar - GuiaCidadão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/screens.css">
</head>
<body>
  <div id="app">
    <div id="perfil-familiar" class="screen active">
      <!-- Cabeçalho -->
      <div class="app-header">
        <a href="/src/pages/home/home.html">
          <button class="back-btn" aria-label="Voltar" type="button">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
          </button>
        </a>
        <a class="header-logo">
          <img src="/src/assets/icons/Logo.png" alt="GuiaCidadão">
          GuiaCidadão
        </a>
        <div style="width:36px"></div>
      </div>

      <!-- Conteúdo -->
      <div class="scroll-content">
        <div style="padding: 0 20px 24px;">
          <!-- Título da Página -->
          <div class="auth-title-block" style="margin-bottom: 24px;">
            <h1 class="page-title">Perfil Familiar</h1>
          </div>

          <!-- Cartão de Resumo -->
          <div class="benefit-card card-blue">
            <h2 style="font-family: var(--font-main); font-size: 16px; font-weight: 800; margin-bottom: 12px;">Resumo Familiar</h2>
            <p><strong>Membros:</strong> <span id="total-membros">0</span></p>
            <p><strong>Renda Total:</strong> <span id="renda-total">R$ 0,00</span></p>
            <p><strong>Renda Per Capita:</strong> <span id="renda-per-capita">R$ 0,00</span></p>
          </div>

          <!-- Seção de Membros -->
          <div style="margin-top: 24px;">
            <h2 style="font-family: var(--font-main); font-size: 16px; font-weight: 800; color: var(--text-dark); margin-bottom: 16px;">Membros da Família</h2>
            <div id="members-container"></div>

            <!-- Botão Adicionar Membro -->
            <a href="/src/pages/perfil-familiar/adicionar-membro.html" style="text-decoration: none; display: block; margin-top: 16px;">
              <button class="btn btn-outline" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path d="M12 5v14M5 12h14"/>
                </svg>
                Adicionar membro
              </button>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/src/pages/perfil-familiar/perfil-familiar.js"></script>
  <div id="bottom-nav-slot"></div>
  <script src="/src/js/shared/bottom-nav-cidadao.js"></script>
</body>
</html>
