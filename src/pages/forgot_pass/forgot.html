<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GuiaCidadão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/screens.css">
</head>
<div id="app">
<body>
  
  <div id="recuperar-senha" class="screen active auth-screen">
    <div class="app-header">
      <a href="/src/pages/login/login.html">
      <button class="back-btn" data-back="login" aria-label="Voltar" type="button">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      </button>
    
      <a class="header-logo">
        <img src="/src/assets/icons/Logo.png" alt="GuiaCidadão">
        GuiaCidadão
      </a>
      <div style="width:36px"></div>
    </div>

    <div class="scroll-content">
      <div class="auth-body">
        <div class="auth-title-block">
          <h1 class="page-title">Recuperação de senha</h1>
          <p class="page-subtitle">Informe seu CPF ou email para iniciar a recuperação</p>
        </div>

        <div class="form-group">
          <label class="form-label">CPF ou Email</label>
          <input class="form-input" type="text" id="rec-id" placeholder="Ex: 000.000.000-00">
        </div>

        <button class="btn btn-primary" id="btn-enviar-codigo" style="margin-top:8px;">Enviar Código</button>
        <p id="forgot-feedback" style="margin-top: 12px; font-size: 13px; line-height: 1.4;"></p>

        <div class="auth-links">
          <a href="/src/pages/login/login.html">
          <button class="btn-link" data-back="login">Voltar para o login</button>
          </a>

          <a href="/src/pages/register/register.html">
          <button class="btn-link" data-nav="cadastro">Não tenho conta</button>
          </a>

        </div>
      </div>
    </div>
  </div>
  </div>
  <script src="/src/js/shared/cpf.js"></script>
  <script src="/src/pages/forgot_pass/forgot.js"></script>
</body>
</html>
