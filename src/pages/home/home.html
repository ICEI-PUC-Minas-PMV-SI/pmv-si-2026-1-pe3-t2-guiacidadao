<script>
  // Setup protocol number on success
  document.addEventListener('DOMContentLoaded', () => {
    // Override confirm to also set protocol
    const origConfirm = window.handleConfirmarAgendamento;
    const btnConf = document.getElementById('btn-confirmar-ag');
    if (btnConf) {
      btnConf.addEventListener('click', () => {
        const proto = 'GC-' + Math.floor(Math.random() * 900000 + 100000);
        const el = document.getElementById('protocolo-num');
        if (el) el.textContent = proto;
      }, true);
    }

    // CRAS Mais próximo navigation from sidebar
    document.querySelectorAll('[data-nav="unidades"]').forEach(el => {
      el.addEventListener('click', () => {
        renderUnidades();
        navigate('unidades');
      });
    });
  });
  
// 1. Pega o dado salvo no localStorage (substitua 'usuario' pela chave que você usou para salvar)
        const usuarioon = localStorage.getItem('usuarioLogado');
        const nomeuser= JSON.parse(usuarioon);
        const nomeusuario = nomeuser.nome;

        // 2. Verifica se o dado realmente existe
        if (nomeusuario) {
            // 3. Atualiza o texto do elemento HTML com o nome do usuário
            document.getElementById('sidebar-username').textContent = nomeuser.nome;
        }
