<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unidades de Atendimento - GuiaCidadão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/screens.css">
</head>
<body>
  <div id="app">
    <div id="unidades-screen" class="screen active">
      <div class="app-header">
        <a href="/src/pages/home/home.html">
          <button class="back-btn" aria-label="Voltar" type="button">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
          </button>
        </a>
        <a class="header-logo">
          <img src="/src/assets/icons/Logo.png" alt="GuiaCidadão">
          GuiaCidadão
        </a>
        <div style="width:36px"></div>
      </div>

      <div class="scroll-content">
        <div style="padding: 0 20px 24px;">
          <div class="auth-title-block" style="margin-bottom: 16px;">
            <h1 class="page-title">Unidades de Atendimento</h1>
            <p class="page-subtitle">Encontre a unidade mais próxima informando seu CEP.</p>
          </div>

          <div class="benefit-card card-blue">
            <label for="busca-cep" style="font-weight: 600;">Seu CEP</label>
            <input id="busca-cep" type="text" inputmode="numeric" maxlength="9" class="form-input" placeholder="00000-000" style="margin-top: 6px;">
            <p id="cep-feedback" style="margin-top: 8px; font-size: 13px; color: var(--text-muted);"></p>
          </div>

          <div style="margin-top: 12px;">
            <label for="filtro-tipo" style="font-weight: 600;">Tipo de unidade</label>
            <select id="filtro-tipo" class="form-input" style="margin-top: 6px;">
              <option value="todos">Todos</option>
            </select>
          </div>

          <h2 style="font-family: var(--font-main); font-size: 16px; font-weight: 800; margin: 24px 0 12px;" id="lista-titulo">Unidades disponíveis</h2>
          <div id="lista-unidades"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/src/js/shared/storage-api.js"></script>
  <script src="/src/js/colaborador/mocks/unidades.js"></script>
  <script src="/src/pages/unidades/unidades.js"></script>
  <div id="bottom-nav-slot"></div>
  <script src="/src/js/shared/bottom-nav-cidadao.js"></script>
</body>
</html>
