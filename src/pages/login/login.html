<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - GuiaCidadão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/colaborador.css">
</head>
<body>
  <div id="app">
    <main class="auth-shell">
      <header class="auth-hero">
        <h1 class="auth-brand">GuiaCidadão</h1>
        <p class="auth-hero-sub">Acesso seguro</p>
      </header>
      <div class="auth-tabs" id="auth-tabs" role="tablist">
        <button type="button" role="tab" class="auth-tab auth-tab--active" data-tab="cidadao">Cidadão</button>
        <button type="button" role="tab" class="auth-tab" data-tab="colaborador">Colaborador</button>
      </div>
      <form class="auth-card" id="form-cidadao">
        <h2 class="auth-card-title">Acessar como cidadão</h2>
        <div id="cidadao-fields"></div>
        <div id="cidadao-actions"></div>
      </form>
      <form class="auth-card auth-card--hidden" id="form-colaborador">
        <h2 class="auth-card-title">Acesso institucional</h2>
        <div id="colaborador-fields"></div>
        <div id="colaborador-actions"></div>
      </form>
      <div style="text-align: center; margin-top: 16px;">
        <a href="/src/pages/triagem/triagem.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Não tenho cadastro: ver benefícios disponíveis</a>
      </div>
    </main>
  </div>

  <script src="/src/js/shared/cpf.js"></script>
  <script src="/src/js/colaborador/utils/escape.js"></script>
  <script src="/src/js/colaborador/shared/input.js"></script>
  <script src="/src/js/colaborador/shared/button.js"></script>
  <script src="/src/js/colaborador/mocks/profile.js"></script>
  <script src="/src/pages/login/login-controller.js"></script>
  <script src="/src/pages/login/login.js"></script>
</body>
</html>
